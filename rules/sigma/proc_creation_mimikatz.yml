title: Mimikatz Credential Dumping Activity
id: f1a2b3c4-2222-4000-8000-000000000002
status: production
description: Detects process command lines executing known Mimikatz commands for LSASS and SAM dumping.
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: Centralium EDR Engineering
date: 2026-10-07
level: critical
tags:
  - attack.credential_access
  - attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - sekurlsa::logonpasswords
      - lsadump::sam
      - lsadump::secrets
      - privilege::debug
      - sekurlsa::wdigest
  condition: selection
falsepositives:
  - Authorized red team exercises
